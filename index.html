<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月薪账本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="账本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: iOS-style large title, a "today" figure on the page ground, a month-of-days bar strip, then grouped lists */
:root{
  --bg:#F2F2F4; --surface:#FFFFFF; --ink:#1A1A1C; --sub:#7D7D85; --faint:#B9B9C0; --hair:rgba(60,60,67,.13);
  --fill:#ECECEF; --on-ink:#FFFFFF;
  --pos:#2C7A57; --warn:#B8761A; --neg:#CC3D2A;
  --bar:#3A3A3E; --bar-future:#E4E4E8;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --txt:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0C; --surface:#1C1C1E; --ink:#F2F2F4; --sub:#8E8E95; --faint:#55555B; --hair:rgba(255,255,255,.1);
  --fill:#2A2A2D; --on-ink:#0B0B0C; --pos:#4CC38A; --warn:#E3A33E; --neg:#FF6B57; --bar:#D8D8DC; --bar-future:#2A2A2D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0C; --surface:#1C1C1E; --ink:#F2F2F4; --sub:#8E8E95; --faint:#55555B; --hair:rgba(255,255,255,.1);
  --fill:#2A2A2D; --on-ink:#0B0B0C; --pos:#4CC38A; --warn:#E3A33E; --neg:#FF6B57; --bar:#D8D8DC; --bar-future:#2A2A2D; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--txt);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.n{font-family:var(--round);font-variant-numeric:tabular-nums}
.app{max-width:500px;margin:0 auto;padding-block:8px 128px;display:flex;flex-direction:column;gap:26px}

/* title */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.top h1{margin:0;font-family:var(--round);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top h1 small{font-size:17px;font-weight:500;color:var(--sub);margin-left:6px;letter-spacing:0}
.chevs{display:flex;gap:8px;align-items:center}
.chev{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.chev svg{width:16px;height:16px}
.today-link{font-size:14px;color:var(--sub);padding:0 4px}

/* hero */
.hero{display:flex;flex-direction:column;gap:4px;padding-inline:2px}
.eyebrow{font-size:15px;color:var(--sub)}
.hero-num{font-family:var(--round);font-variant-numeric:tabular-nums;font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hero-num .c{font-size:30px;color:var(--sub);letter-spacing:0}
.hero-num.neg{color:var(--neg)}
.hero-sub{font-size:15px;color:var(--sub)}
.hero-sub b{color:var(--ink);font-weight:600}
.hero-sub .neg b{color:inherit}
.banner{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.banner svg{width:14px;height:14px;flex:none}

/* sections */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:4px;font-size:13px;color:var(--sub)}
.sec-h h2{margin:0;font-size:13px;font-weight:500;letter-spacing:.04em}
.group{background:var(--surface);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;min-height:50px;width:100%;text-align:left}
.go{color:var(--ink);justify-content:space-between}
.go svg{width:14px;height:14px;color:var(--faint)}
.li+.li::before,.li+.blk::before,.blk+.li::before,.blk+.blk::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.blk{display:flex;flex-direction:column;gap:8px;padding:14px 16px;position:relative}
.grow{flex:1;min-width:0}
.right{margin-left:auto;text-align:right;white-space:nowrap}
.dim{color:var(--sub)}
.tiny{font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.pos{color:var(--pos)} .warn{color:var(--warn)} .neg{color:var(--neg)}

/* day strip */
.strip-wrap{padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px}
.strip{position:relative;display:grid;gap:2px;height:96px;align-items:end}
.col{height:100%;display:flex;flex-direction:column-reverse;border-radius:3px;overflow:hidden;background:var(--bar-future)}
.col.future{opacity:.45}
.col i{display:block;width:100%;flex:none}
.col i.f{background:var(--bar)}
.col i.f.over{background:var(--neg)}
.col.today{box-shadow:0 0 0 1.5px var(--ink)}
.avg{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--sub);pointer-events:none}
.marks,.axis{display:grid;gap:2px}
.mk{height:5px;width:5px;border-radius:50%;justify-self:center}
.axis span{font-size:11px;color:var(--sub);text-align:center;font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub);padding-top:2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.legend i.l{width:14px;height:0;border-top:1.5px dashed var(--sub);border-radius:0}

/* category rows */
.cat-top{display:flex;align-items:center;gap:10px}
.cat-name{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-amt{margin-left:auto;font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.cat-amt .of{color:var(--sub)}
.track{height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.track i{display:block;height:100%;border-radius:2px;background:var(--ink)}
.track i.ok{background:var(--pos)} .track i.warn{background:var(--warn)} .track i.neg{background:var(--neg)}
.cat-foot{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.date{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--fill);color:var(--ink);font-family:var(--round);font-variant-numeric:tabular-nums}
.date.past{color:var(--faint);text-decoration:line-through}
.date.next{background:var(--ink);color:var(--on-ink)}

/* ledger rows */
.e-title{font-weight:500}
.e-note{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-amt{font-family:var(--round);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* buttons & notices */
.btn{border-radius:12px;padding:14px 18px;font-weight:600;background:var(--ink);color:var(--on-ink);text-align:center}
.btn.soft{background:var(--fill);color:var(--ink)}
.btn.full{width:100%}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.note{font-size:14px;color:var(--sub);padding:0 4px;line-height:1.6;margin:0}
.alert{background:var(--surface);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--warn)}
.empty{padding:22px 16px;color:var(--sub);font-size:15px;text-align:center}
.steps{padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.steps b{font-size:18px}
.steps ol{margin:0;padding-left:20px;color:var(--sub);display:flex;flex-direction:column;gap:6px;font-size:15px}

/* plan form */
.plan-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
.plan-bar h1{margin:0;font-size:17px;font-weight:600}
.txt-btn{color:var(--ink);font-size:17px;padding:6px 2px}
.txt-btn.strong{font-weight:600}
.fin{border:0;background:none;outline:none;min-width:0;padding:0;font-size:16px}
.fin.money{font-family:var(--round);font-variant-numeric:tabular-nums;text-align:right;width:6.5em;flex:none}
.fin::placeholder{color:var(--faint)}
.del{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--sub);display:grid;place-items:center;flex:none}
.del svg{width:11px;height:11px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border-radius:7px;padding:6px 6px;font-size:13px;color:var(--ink);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg small{font-size:11px;color:var(--sub);font-weight:400}
.add-date{position:relative;font-size:12px;padding:2px 9px;border-radius:6px;border:1px dashed var(--faint);color:var(--sub)}
.add-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sum-row{display:flex;justify-content:space-between;gap:10px}
.sum-total{font-weight:600}
.rule{height:1px;background:var(--hair);margin:2px 0}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--hair);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:500px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);padding:4px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.plus{margin-inline:6px;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.plus svg{width:24px;height:24px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:14px 14px 0 0;max-height:94%;overflow:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:500px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-top:6px}
.sheet-bar h3{margin:0;font-size:17px;font-weight:600}
.sheet-bar .txt-btn:first-child{justify-self:start}
.sheet-bar .txt-btn:last-child{justify-self:end}
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:6px 0 2px}
.amount span{font-family:var(--round);font-size:34px;color:var(--sub);font-weight:600}
#amt{border:0;background:none;outline:none;font-family:var(--round);font-variant-numeric:tabular-nums;font-size:56px;font-weight:700;letter-spacing:-.02em;
  width:1.2ch;max-width:8ch;min-width:0;padding:0;text-align:left;caret-color:var(--ink)}
#amt::placeholder{color:var(--faint)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick{background:var(--surface);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px;font-weight:500;min-width:0}
.pick small{font-size:11px;color:var(--sub);font-weight:400;font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.pick .dot{margin-bottom:2px}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.pick[aria-pressed="true"] small{color:var(--on-ink);opacity:.7}
.field-label{font-size:13px;color:var(--sub);padding-inline:4px;margin-bottom:-10px}
.li > label{flex:none;width:3em}
.li > label.grow{flex:1;width:auto}
.li input[type="date"]{-webkit-appearance:none;appearance:none;text-align:right;margin-left:auto}
.danger{color:var(--neg);font-weight:500;text-align:center;width:100%;padding:14px;background:var(--surface);border-radius:14px}
.danger.armed{background:var(--neg);color:#fff}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.bad{background:var(--neg);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40%)}}
  .overlay{animation:fade .2s}@keyframes fade{from{opacity:0}}
  .toast{animation:pop .2s}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
}
</style>
<script>// 本地数据层：数据只存在这台手机里（localStorage），接口和页面原来用的云端数据库一致
(function(){
  const KEY="yuexin-ledger-v1";
  let store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){store={}}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const listeners=new Set();
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){return Promise.reject({code:"quota_exceeded",message:"手机存储已满"})}
    listeners.forEach(f=>{try{f()}catch(e){}});return Promise.resolve();
  }
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=(path,d)=>({id:path.split("/").pop(),exists:d!=null,data:()=>clone(d),metadata:meta});
  function doc(path){
    return {id:path.split("/").pop(),path,
      get:async()=>snap(path,store[path]),
      set:async d=>{store[path]=clone(d);return save()},
      update:async d=>{if(store[path]==null)throw {code:"invalid_argument",message:"not found"};Object.assign(store[path],clone(d));return save()},
      delete:async()=>{delete store[path];return save()},
      onSnapshot(next){const f=()=>next(snap(path,store[path]));listeners.add(f);setTimeout(f);return()=>listeners.delete(f)},
      collection:c=>query(path+"/"+c,[],0)};
  }
  function query(coll,filters,lim){
    const depth=coll.split("/").length+1;
    const test=(x,op,v)=>op===">="?x>=v:op==="<"?x<v:op===">"?x>v:op==="<="?x<=v:op==="=="?x===v:op==="!="?x!==v:true;
    const run=()=>{
      let docs=Object.keys(store).filter(k=>k.startsWith(coll+"/")&&k.split("/").length===depth)
        .filter(k=>filters.every(([f,op,v])=>test(store[k][f],op,v))).sort().map(k=>snap(k,store[k]));
      if(lim)docs=docs.slice(0,lim);
      return {docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]};
    };
    return {path:coll,
      where:(f,op,v)=>query(coll,[...filters,[f,op,v]],lim),
      limit:n=>query(coll,filters,n),orderBy:()=>query(coll,filters,lim),
      get:async()=>run(),
      onSnapshot(next){const f=()=>next(run());listeners.add(f);setTimeout(f);return()=>listeners.delete(f)},
      doc:id=>doc(coll+"/"+(id||rid())),
      add:async d=>{const r=doc(coll+"/"+rid());await r.set(d);return r}};
  }
  const db={doc,collection:c=>query(c,[],0)};
  window.claude={use:async n=>n==="db"?db:null};
  window.LedgerLocal={
    async exportFile(){
      const name="账本备份-"+new Date().toISOString().slice(0,10)+".json";
      const blob=new Blob([JSON.stringify({app:"月薪账本",version:1,docs:store},null,1)],{type:"application/json"});
      const file=new File([blob],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    },
    importText(t){
      const o=JSON.parse(t),docs=o&&o.docs;
      if(!docs||typeof docs!=="object")throw new Error("bad");
      store=docs;save();return Object.keys(docs).length;
    }
  };
})();
</script>

<div class="app" id="app">

</div>

<nav class="tabs"><div class="in">

<script>
(function(){
const COLORS=["#3F8F6B","#4A74B8","#D08A35","#9B5DB0","#D0574A","#3A9AA3","#8A9440","#B5658A","#6E7681","#A07A4C"];
const DEFAULT_CATS=["房租/房贷","餐饮","交通","购物","生活缴费","娱乐","见面","其他"];
const TYPES=[["daily","日常"],["fixed","固定扣除"],["sched","指定日期"]];
const SUBS=["吃饭","交通","购物","娱乐","礼物","其他"];
const INC_KINDS=["奖金","报销","红包","兼职","其他"];
const WEEK="日一二三四五六";
const ICON_L='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>';
const ICON_R='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>';
const ICON_X='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg>';
const CHEV='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg>';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round(n*100)/100;
const sum=(a,e)=>a+Number(e.amount||0);
function money(n){const neg=n<0;n=Math.abs(r2(n));return (neg?"−":"")+"¥"+n.toLocaleString("zh-CN",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function bigMoney(n){const [i,dec]=Math.abs(r2(n)).toFixed(2).split(".");return `${n<0?"−":""}¥${Number(i).toLocaleString("zh-CN")}${dec!=="00"?`<span class="c">.${dec}</span>`:""}`}
function pad(n){return String(n).padStart(2,"0")}
function localDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayStr(){return localDate(new Date())}
function shiftMonth(m,k){let [y,mo]=m.split("-").map(Number);mo+=k;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+"-"+pad(mo)}
function daysIn(m){const [y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()}
function addDays(ds,n){const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return localDate(d)}
function md(ds){return Number(ds.slice(5,7))+"/"+Number(ds.slice(8))}
function mdCn(ds){return Number(ds.slice(5,7))+"月"+Number(ds.slice(8))+"日"}
function parseNum(v){const n=parseFloat(String(v).replace(/[,，¥\s]/g,""));return isFinite(n)?r2(n):0}
const uid=()=>"c"+Math.random().toString(36).slice(2,9);
function ctype(c){return c.type||(/房租|房贷/.test(c.name||"")?"fixed":/见面/.test(c.name||"")?"sched":"daily")}
function catColor(i){return COLORS[i%COLORS.length]}
function level(s,b){if(b<=0)return s>0?"neg":"";const p=s/b;return p>1?"neg":p>=.85?"warn":""}

/* 账期：从发薪日到下次发薪前一天。key = 账期开始所在的年月 */
let payday=1;
function startOf(key){return key+"-"+pad(Math.min(payday,daysIn(key)))}
function endOf(key){return startOf(shiftMonth(key,1))}            // 不含
function lastOf(key){return addDays(endOf(key),-1)}
function keyOf(ds){const ym=ds.slice(0,7);return ds>=startOf(ym)?ym:shiftMonth(ym,-1)}
function curKey(){return keyOf(todayStr())}
function periodDays(key){const r=[],b=endOf(key);for(let x=startOf(key);x<b;x=addDays(x,1))r.push(x);return r}
function periodLabel(key){return payday===1?`${key.slice(0,4)}年${Number(key.slice(5))}月`:`${md(startOf(key))}–${md(lastOf(key))}`}
function schedDates(c,key){
  let ds=c.dates?c.dates.slice():(c.days||[]).filter(d=>d<=daysIn(key)).map(d=>key+"-"+pad(d));
  return [...new Set(ds)].sort();
}
function shiftDate1M(ds){const k=shiftMonth(ds.slice(0,7),1);return k+"-"+pad(Math.min(Number(ds.slice(8)),daysIn(k)))}
const inPeriod=(ds,key)=>ds>=startOf(key)&&ds<endOf(key);

/* ---------- state ---------- */
let db=null,dbState="loading",settingsLoaded=false,month=null,plan,exps=[],incs=[],expLoaded=false,incLoaded=false,unsubs=[],loadTimer=null,slow=false;
let view="today",lastView="today",draft=null,autoTried={},review=null,reviewSig=null,reviewLoading=false;

/* ---------- data ---------- */
function boot(){
  loadTimer=setTimeout(()=>{slow=true;render()},10000);
  db.doc("settings/main").onSnapshot(s=>{
    const p=Math.min(31,Math.max(1,Math.round(Number(s.exists&&s.data().payday)||1)));
    if(settingsLoaded&&p===payday)return;
    payday=p;settingsLoaded=true;month=curKey();review=null;reviewSig=null;
    if(view==="plan"){draft=null;view=lastView}
    subscribe();
  },onErr);
}
function subscribe(){
  unsubs.forEach(u=>u());unsubs=[];plan=undefined;exps=[];incs=[];expLoaded=false;incLoaded=false;slow=false;clearTimeout(loadTimer);
  if(!db){render();return}
  loadTimer=setTimeout(()=>{slow=true;render()},10000);
  const m=month,a=startOf(m),b=endOf(m);
  unsubs.push(db.doc("months/"+m).onSnapshot(s=>{
    if(m!==month)return;
    if(!s.exists&&!s.metadata.fromCache&&m>=curKey()&&!autoTried[m]){autoTried[m]=true;autoCopy(m)}
    plan=s.exists?s.data():null;if(!s.metadata.fromCache)slow=false;done()},onErr));
  unsubs.push(db.collection("expenses").where("date",">=",a).where("date","<",b).onSnapshot(s=>{if(m!==month)return;exps=s.docs.map(d=>Object.assign({id:d.id},d.data()));expLoaded=true;done()},onErr));
  unsubs.push(db.collection("incomes").where("date",">=",a).where("date","<",b).onSnapshot(s=>{if(m!==month)return;incs=s.docs.map(d=>Object.assign({id:d.id},d.data()));incLoaded=true;done()},onErr));
  render();
}
function ready(){return dbState==="ready"&&settingsLoaded&&plan!==undefined&&expLoaded&&incLoaded}
function done(){if(ready())clearTimeout(loadTimer);if(view==="plan"&&draft)return;render()}
function onErr(e){clearTimeout(loadTimer);toast("读取失败："+(e&&e.message||"请稍后再试"),true);dbState="none";render()}
// 新账期没有规划时，自动沿用上一期，见面日期顺延一个月
async function autoCopy(m){
  try{
    const pk=shiftMonth(m,-1),s=await db.doc("months/"+pk).get();
    if(!s.exists)return;
    const p=JSON.parse(JSON.stringify(s.data()));
    p.cats=(p.cats||[]).map(c=>{const o={id:c.id,name:c.name,budget:Number(c.budget||0),type:ctype(c)};
      if(o.type==="sched")o.dates=schedDates(c,pk).map(shiftDate1M).filter(x=>inPeriod(x,m));return o});
    p.autoCopied=true;p.updatedAt=Date.now();
    const again=await db.doc("months/"+m).get();if(again.exists)return;
    await db.doc("months/"+m).set(p);
    if(m===month)toast("已沿用上期规划");
  }catch(e){}
}

/* ---------- numbers ---------- */
function compute(){
  const cats=(plan&&plan.cats)||[],key=month,days=periodDays(key),n=days.length,start=days[0],end=endOf(key);
  const today=todayStr(),isCur=today>=start&&today<end;
  const byCat={};exps.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+Number(e.amount||0)});
  const known=new Set(cats.map(c=>c.id));
  let other=0;Object.keys(byCat).forEach(k=>{if(!known.has(k))other+=byCat[k]});other=r2(other);
  const catSpent=c=>{const l=r2(byCat[c.id]||0);return ctype(c)==="fixed"?Math.max(Number(c.budget||0),l):l};
  const budget=r2(cats.reduce((a,c)=>a+Number(c.budget||0),0));
  const spent=r2(cats.reduce((a,c)=>a+catSpent(c),0)+other);
  const projSpend=r2(cats.reduce((a,c)=>a+Math.max(Number(c.budget||0),catSpent(c)),0)+other);
  const flexIds=new Set(cats.filter(c=>ctype(c)==="daily").map(c=>c.id));
  const isFlex=e=>flexIds.has(e.cat)||!known.has(e.cat);
  const schedCats=cats.filter(c=>ctype(c)==="sched");
  const flexBudget=r2(cats.filter(c=>ctype(c)==="daily").reduce((a,c)=>a+Number(c.budget||0),0));
  const flexEx=exps.filter(isFlex);
  const flexSpent=r2(flexEx.reduce(sum,0));
  const flexBefore=r2(flexEx.filter(e=>e.date<today).reduce(sum,0));
  const todaySpent=r2(flexEx.filter(e=>e.date===today).reduce(sum,0));
  const sd={};schedCats.forEach(c=>{sd[c.id]=schedDates(c,key).filter(x=>x>=start&&x<end)});
  const meet=new Set();Object.values(sd).forEach(a=>a.forEach(x=>meet.add(x)));
  const ti=isCur?days.indexOf(today):(today>=end?n:-1);
  const todayMeet=isCur&&meet.has(today);
  // 见面日不分日常预算：日常预算只摊到非见面日
  const remDays=isCur?days.slice(ti).filter(x=>!meet.has(x)).length:0;
  const remAfter=isCur?days.slice(ti+1).filter(x=>!meet.has(x)).length:0;
  const freeDays=n-meet.size;
  const daily=isCur&&!todayMeet&&remDays?Math.max(0,flexBudget-flexBefore)/remDays:0;
  const tomorrow=remAfter?Math.max(0,flexBudget-flexSpent)/remAfter:0;
  let meetToday=null;
  if(todayMeet){
    const mc=schedCats.find(c=>sd[c.id].includes(today)),mb=Number(mc.budget||0),ms=exps.filter(e=>e.cat===mc.id);
    meetToday={cat:mc,per:mb/Math.max(1,sd[mc.id].length),spent:r2(ms.filter(e=>e.date===today).reduce(sum,0)),left:r2(mb-ms.reduce(sum,0)),rem:sd[mc.id].filter(x=>x>today).length};
  }
  const dayFlex={},dayOcc={};
  exps.forEach(e=>{if(isFlex(e))dayFlex[e.date]=(dayFlex[e.date]||0)+Number(e.amount||0);
    else if(schedCats.some(c=>c.id===e.cat))dayOcc[e.date]=(dayOcc[e.date]||0)+Number(e.amount||0)});
  const fixedTotal=r2(cats.filter(c=>ctype(c)==="fixed").reduce((a,c)=>a+Number(c.budget||0),0));
  const extra=r2(incs.reduce(sum,0));
  const income=r2(Number(plan&&plan.income||0)+extra),saving=Number(plan&&plan.saving||0);
  return {cats,byCat,other,budget,spent,days,n,start,end,today,isCur,ti,flexBudget,flexSpent,todaySpent,remDays,remAfter,daily,tomorrow,
    fixedTotal,schedCats,sd,meet,freeDays,meetToday,dayFlex,dayOcc,extra,income,saving,saveProj:r2(income-projSpend)};
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("[data-tab]").forEach(t=>t.setAttribute("aria-current",t.dataset.tab===view?"page":"false"));
  const app=$("#app");
  if(view==="plan"&&draft){renderPlan(app);return}
  let h=view==="today"?todayTitle():(month?titleBar():"");
  if(dbState==="none")h+=`<div class="alert">账本保存在你的 claude.ai 账户里。请先在 Safari 登录 claude.ai，再打开这个页面。</div>`;
  else if(!ready())h+=`<div class="empty">${slow?"暂时连不上，检查一下网络…":"正在打开账本…"}</div>`;
  else{
    if(slow)h+=`<div class="alert">网络不稳定，下面的数字可能不是最新。</div>`;
    h+=view==="today"?todayBody():view==="budget"?budgetBody():listBody();
  }
  app.innerHTML=h;bindHome();
}
function todayTitle(){
  const t=new Date();
  return `<header class="top"><h1>今天<small>${t.getMonth()+1}月${t.getDate()}日 周${WEEK[t.getDay()]}</small></h1></header>`;
}
function titleBar(){
  const [y,mo]=month.split("-");
  return `<header class="top"><h1>${payday===1?Number(mo)+"月":md(startOf(month))+"–"+md(lastOf(month))}<small>${y}</small></h1>
    <div class="chevs">${month!==curKey()?`<button class="today-link" id="toNow">回到本期</button>`:""}
    <button class="chev" id="prevM" aria-label="上一期">${ICON_L}</button><button class="chev" id="nextM" aria-label="下一期">${ICON_R}</button></div></header>`;
}
function bindHome(){
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  on("prevM",()=>go(shiftMonth(month,-1)));on("nextM",()=>go(shiftMonth(month,1)));on("toNow",()=>go(curKey()));
  on("copyPrev",copyPrev);on("newPlan",()=>openPlan(null));
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openSheet(exps.find(e=>e.id===b.dataset.id),"exp"));
  document.querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>openSheet(incs.find(e=>e.id===b.dataset.inc),"inc"));
  document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>switchTab(b.dataset.goto));
  document.querySelectorAll("[data-act=meet]").forEach(b=>b.onclick=openMeet);
}
function go(m){month=m;draft=null;if(view==="plan")view=lastView;subscribe()}
function switchTab(t){
  if(t==="plan"){if(view!=="plan"&&ready()){lastView=view;openPlan(null)}return}
  draft=null;view=t;window.scrollTo(0,0);
  if(t==="today"&&month&&month!==curKey()){month=curKey();subscribe()}else render();
}

/* 今天 */
function heroHtml(c){
  if(c.meetToday){
    const m=c.meetToday,left=r2(m.per-m.spent);
    return `<section class="hero"><div class="eyebrow">今天${esc(m.cat.name)}${left<0?"，超出":"，还能花"}</div>
      <div class="hero-num ${left<0?"neg":""}">${bigMoney(Math.abs(left))}</div>
      ${m.spent?`<div class="hero-sub">已花 <b class="n">${money(m.spent)}</b></div>`:""}</section>`;
  }
  const left=r2(c.daily-c.todaySpent);
  let sub;
  if(left<0)sub=c.remAfter?`<span class="neg">明天起每天 <b class="n">${money(c.tomorrow)}</b></span>`:"";
  else sub=c.todaySpent?`已花 <b class="n">${money(c.todaySpent)}</b>`:"";
  return `<section class="hero"><div class="eyebrow">${left<0?"今天超出":"今天还能花"}</div>
    <div class="hero-num ${left<0?"neg":""}">${bigMoney(Math.abs(left))}</div>${sub?`<div class="hero-sub">${sub}</div>`:""}</section>`;
}
function todayBody(){
  if(!plan)return noPlanHtml();
  const c=compute(),cats=c.cats,today=c.today;
  let h=heroHtml(c);
  const tl=[...exps.filter(e=>e.date===today).map(e=>({e,t:"e"})),...incs.filter(e=>e.date===today).map(e=>({e,t:"i"}))].sort((a,b)=>(b.e.ts||0)-(a.e.ts||0));
  if(tl.length)h+=`<div class="group">${tl.map(x=>x.t==="e"?rowHtml(x.e,cats):incRow(x.e)).join("")}</div>`;
  const sc=c.schedCats[0],nx=sc&&c.sd[sc.id].find(x=>x>today);
  if(nx)h+=`<div class="group"><button class="li go" data-act="meet"><span class="grow">下次${esc(sc.name)}</span><span class="n dim">${mdCn(nx)}</span>${CHEV}</button></div>`;
  return h;
}

/* 预算 */
function stripHtml(c){
  const avg=c.flexBudget/Math.max(1,c.freeDays);
  let max=avg*2;c.days.forEach(x=>{max=Math.max(max,(c.dayFlex[x]||0)+(c.dayOcc[x]||0))});
  if(!max)max=1;
  const schedOn={};c.schedCats.forEach(sc=>{const i=c.cats.indexOf(sc);c.sd[sc.id].forEach(x=>schedOn[x]=catColor(i))});
  let cols="",marks="",axis="",lastLab=-9;
  c.days.forEach((x,i)=>{
    const f=c.dayFlex[x]||0,o=c.dayOcc[x]||0,fut=x>c.today;
    cols+=`<div class="col${fut?" future":""}${x===c.today?" today":""}" title="${mdCn(x)} 日常 ${money(f)}${o?" · 见面 "+money(o):""}">`+
      `<i class="f${avg&&f>avg*1.5?" over":""}" style="height:${f/max*100}%"></i>${o?`<i style="height:${o/max*100}%;background:${schedOn[x]||"var(--sub)"}"></i>`:""}</div>`;
    marks+=schedOn[x]?`<b class="mk" style="background:${schedOn[x]}"></b>`:"<span></span>";
    const dd=x.slice(8);let lab="";
    if(i===0||dd==="01")lab=md(x);else if((dd==="10"||dd==="20"||i===c.n-1)&&i-lastLab>3)lab=String(Number(dd));
    if(lab&&i-lastLab<3&&i!==0&&dd!=="01")lab="";
    if(lab)lastLab=i;
    axis+=`<span>${lab}</span>`;
  });
  const g=`grid-template-columns:repeat(${c.n},minmax(0,1fr))`;
  const sc=c.schedCats.find(s=>c.sd[s.id].length);
  return `<section class="sec"><div class="sec-h"><h2>每天</h2></div>
    <div class="group strip-wrap">
      <div class="strip" style="${g}">${cols}${avg?`<div class="avg" style="bottom:${avg/max*100}%"></div>`:""}</div>
      ${sc?`<div class="marks" style="${g}">${marks}</div>`:""}
      <div class="axis" style="${g}">${axis}</div>
    </div></section>`;
}
function catsHtml(c){
  const order={fixed:0,sched:1,daily:2};
  const idx=c.cats.map((x,i)=>i).sort((a,b)=>order[ctype(c.cats[a])]-order[ctype(c.cats[b])]||a-b);
  let rows="";
  idx.forEach(i=>{
    const cat=c.cats[i],t=ctype(cat),b=Number(cat.budget||0),logged=r2(c.byCat[cat.id]||0);
    if(t==="fixed"||(t==="sched"&&!c.sd[cat.id].length))return;
    const l=level(logged,b),p=b>0?Math.min(100,logged/b*100):(logged>0?100:0);
    let extra="";
    if(t==="sched"){
      const ds=c.sd[cat.id],next=c.isCur?ds.find(x=>x>=c.today):null;
      extra=`<div class="dates">${ds.map(x=>`<span class="date ${c.isCur&&x<c.today?"past":x===next?"next":""}">${md(x)}</span>`).join("")}</div>`;
    }
    rows+=`<div class="blk"><div class="cat-top"><i class="dot" style="background:${catColor(i)}"></i><span class="cat-name">${esc(cat.name)}</span>
      <span class="cat-amt ${l==="neg"?"neg":""}">${money(logged)} <span class="of">/ ${money(b)}</span></span></div>
      <div class="track"><i class="${l}" style="width:${p}%"></i></div>${extra}</div>`;
  });
  if(c.other>0)rows+=`<div class="li"><i class="dot" style="background:var(--faint)"></i><span class="grow">未分类</span><span class="cat-amt">${money(c.other)}</span></div>`;
  const sp=c.saveProj;
  rows+=`<div class="li"><span class="grow cat-name">存下</span><span class="cat-amt ${sp<c.saving?"warn":""}">${money(sp)} <span class="of">/ ${money(c.saving)}</span></span></div>`;
  return `<section class="sec"><div class="sec-h"><h2>分类</h2></div><div class="group">${rows}</div></section>`;
}
function budgetBody(){
  if(!plan)return noPlanHtml()+reviewHtml(null);
  const c=compute(),fb=r2(c.budget-c.fixedTotal),fs=r2(c.spent-c.fixedTotal),left=r2(fb-fs);
  const hero=`<section class="hero"><div class="eyebrow">${left<0?"超出":"还剩"}</div>
    <div class="hero-num ${left<0?"neg":""}">${bigMoney(Math.abs(left))}</div>
    <div class="hero-sub">预算 <b class="n">${money(fb)}</b></div></section>`;
  return hero+stripHtml(c)+catsHtml(c)+reviewHtml(c);
}

/* 往期回顾：最近 5 个完整账期 + 本期 */
async function loadReview(){
  reviewLoading=true;const sig=payday+"|"+curKey();
  try{
    const ck=curKey(),keys=[];for(let i=5;i>=1;i--)keys.push(shiftMonth(ck,-i));
    const ps=await Promise.all(keys.map(k=>db.doc("months/"+k).get()));
    const a=startOf(keys[0]),b=startOf(ck);
    const [es,is]=await Promise.all([db.collection("expenses").where("date",">=",a).where("date","<",b).limit(1000).get(),
      db.collection("incomes").where("date",">=",a).where("date","<",b).limit(1000).get()]);
    const E=es.docs.map(d=>d.data()),I=is.docs.map(d=>d.data());
    review=keys.map((k,i)=>{
      const p=ps[i].exists?ps[i].data():null,ex=E.filter(x=>inPeriod(x.date,k)),inc=I.filter(x=>inPeriod(x.date,k));
      if(!p&&!ex.length)return null;
      const cats=p?p.cats||[]:[],by={};ex.forEach(x=>{by[x.cat]=(by[x.cat]||0)+Number(x.amount||0)});
      const known=new Set(cats.map(c=>c.id));let spent=0;
      cats.forEach(c=>{const l=by[c.id]||0;spent+=ctype(c)==="fixed"?Math.max(Number(c.budget||0),l):l});
      Object.keys(by).forEach(id=>{if(!known.has(id))spent+=by[id]});
      const over=cats.filter(c=>ctype(c)!=="fixed"&&(by[c.id]||0)>Number(c.budget||0)).map(c=>c.name);
      return {key:k,saved:r2((p?Number(p.income||0):0)+inc.reduce(sum,0)-spent),target:p?Number(p.saving||0):0,over};
    }).filter(Boolean);
  }catch(e){review=[]}
  reviewSig=sig;reviewLoading=false;if(view==="budget")render();
}
function reviewHtml(c){
  if(reviewSig!==payday+"|"+curKey()){if(!reviewLoading)loadReview();return ""}
  if(!review.length)return "";
  const rows=review.slice().reverse().map(r=>`<div class="li"><span class="grow">${payday===1?Number(r.key.slice(5))+"月":md(startOf(r.key))}${r.over.length?`<div class="tiny neg">${r.over.map(esc).join("、")}超了</div>`:""}</span>
    <span class="cat-amt ${r.saved<r.target?"warn":""}">${money(r.saved)} <span class="of">/ ${money(r.target)}</span></span></div>`).join("");
  return `<section class="sec"><div class="sec-h"><h2>往期存下</h2></div><div class="group">${rows}</div></section>`;
}

/* 明细 */
function rowHtml(e,cats){
  const ci=cats.findIndex(x=>x.id===e.cat),cn=ci>=0?cats[ci].name:(e.catName||"未分类");
  const title=e.sub?`${esc(e.sub)}<span class="dim"> · ${esc(cn)}</span>`:esc(cn);
  return `<button class="li" data-id="${esc(e.id)}"><i class="dot" style="background:${ci>=0?catColor(ci):"var(--faint)"}"></i>
    <span class="grow"><span class="e-title">${title}</span>${e.note?`<div class="e-note">${esc(e.note)}</div>`:""}</span><span class="e-amt">${money(e.amount)}</span></button>`;
}
function incRow(e){
  return `<button class="li" data-inc="${esc(e.id)}"><i class="dot" style="background:var(--pos)"></i>
    <span class="grow"><span class="e-title">${esc(e.kind||"收入")}</span>${e.note?`<div class="e-note">${esc(e.note)}</div>`:""}</span><span class="e-amt pos">+${money(e.amount)}</span></button>`;
}
function listBody(){
  const tot=r2(exps.reduce(sum,0)),it=r2(incs.reduce(sum,0));
  let h=`<section class="hero"><div class="eyebrow">本期花了</div><div class="hero-num">${bigMoney(tot)}</div>
    ${it?`<div class="hero-sub">收入 <span class="pos n">+${money(it)}</span></div>`:""}</section>`;
  const all=[...exps.map(e=>({e,t:"e"})),...incs.map(e=>({e,t:"i"}))];
  if(!all.length)return h+`<div class="group"><div class="empty">还没有记录</div></div>`;
  const cats=(plan&&plan.cats)||[];
  all.sort((a,b)=>a.e.date<b.e.date?1:a.e.date>b.e.date?-1:(b.e.ts||0)-(a.e.ts||0));
  const groups={};all.forEach(x=>{(groups[x.e.date]=groups[x.e.date]||[]).push(x)});
  const today=todayStr();
  Object.keys(groups).forEach(d=>{
    const list=groups[d],t=list.filter(x=>x.t==="e").reduce((a,x)=>a+Number(x.e.amount||0),0),dt=new Date(d+"T00:00:00");
    h+=`<section class="sec"><div class="sec-h"><h2>${mdCn(d)} 周${WEEK[dt.getDay()]}${d===today?" · 今天":""}</h2><span class="n">${t?money(t):""}</span></div><div class="group">`;
    list.forEach(x=>{h+=x.t==="e"?rowHtml(x.e,cats):incRow(x.e)});
    h+=`</div></section>`;
  });
  return h;
}
function noPlanHtml(){
  return `<div class="group steps"><b>${periodLabel(month)}还没有规划</b>
    <div class="btns"><button class="btn soft" id="copyPrev">沿用上期</button><button class="btn" id="newPlan">新建</button></div></div>`;
}

/* ---------- plan ---------- */
function defaultDraft(){return {payday,income:"",saving:"",cats:DEFAULT_CATS.map(n=>({id:uid(),name:n,budget:"",type:/房租|房贷/.test(n)?"fixed":/见面/.test(n)?"sched":"daily",dates:[]}))}}
function openPlan(src,srcKey,shift){
  const p=src||plan,sk=srcKey||month;
  draft=p?{payday,income:p.income||"",saving:p.saving||"",cats:(p.cats||[]).map(c=>{
      let ds=schedDates(c,sk);if(shift)ds=ds.map(shiftDate1M);
      return {id:c.id,name:c.name,budget:c.budget||"",type:ctype(c),dates:ds.filter(x=>inPeriod(x,month))}})}:defaultDraft();
  if(view!=="plan")lastView=view;view="plan";render();window.scrollTo(0,0);
}
async function copyPrev(){
  const pk=shiftMonth(month,-1);
  try{const s=await db.doc("months/"+pk).get();
    if(s.exists){openPlan(s.data(),pk,true);toast("已带入上期规划，确认后保存")}else{openPlan(null);toast("上期没有规划，先用默认分类")}}
  catch(e){toast("读取上期失败，请重试",true)}
}
function datePickHtml(attr,list){
  return `<div class="dates">${list.map(x=>`<button class="date" data-rmdate="${x}" ${attr}>${md(x)} ×</button>`).join("")}
    <label class="add-date">＋ 选日期<input type="date" ${attr} data-adddate="1" min="${startOf(month)}" max="${lastOf(month)}"></label></div>`;
}
function renderPlan(app){
  let h=`<div class="plan-bar"><button class="txt-btn" id="cancelPlan">取消</button><h1>规划</h1><button class="txt-btn strong" id="savePlanTop">保存</button></div>
    <section class="sec"><div class="sec-h"><h2>收入</h2></div><div class="group">
      <div class="li"><label for="pPay" class="grow">发薪日</label><input class="fin money" id="pPay" style="width:3em" inputmode="numeric" placeholder="1" value="${esc(draft.payday)}"><span class="dim">号</span></div>
      <div class="li"><label for="pIncome" class="grow">工资</label><input class="fin money" id="pIncome" inputmode="decimal" placeholder="¥0" value="${esc(draft.income)}"></div>
      <div class="li"><label for="pSaving" class="grow">计划存下</label><input class="fin money" id="pSaving" inputmode="decimal" placeholder="¥0" value="${esc(draft.saving)}"></div>
    </div></section>
    <section class="sec"><div class="sec-h"><h2>分类</h2></div><div class="group">`;
  draft.cats.forEach((c,i)=>{
    const t=c.type||"daily";
    h+=`<div class="blk"><div class="cat-top"><i class="dot" style="background:${catColor(i)}"></i>
      <input class="fin grow" id="cn-${c.id}" data-i="${i}" data-k="name" value="${esc(c.name)}" placeholder="分类名" aria-label="分类名">
      <input class="fin money" id="cb-${c.id}" data-i="${i}" data-k="budget" inputmode="decimal" value="${esc(c.budget)}" placeholder="¥0" aria-label="${esc(c.name)} 上限">
      <button class="del" data-del="${i}" aria-label="删除 ${esc(c.name)}">${ICON_X}</button></div>
      <div class="seg" role="group" aria-label="类型">${TYPES.map(([k,lab])=>`<button data-ti="${i}" data-type="${k}" aria-pressed="${t===k}">${lab}</button>`).join("")}</div>`;
    if(t==="sched")h+=datePickHtml(`data-ci="${i}"`,(c.dates||[]).slice().sort());
    h+=`</div>`;
  });
  h+=`<button class="li" id="addCat" style="color:var(--sub)">＋ 分类</button></div></section>
    <div class="group blk" id="sumbox"></div>
    <button class="btn full" id="savePlan">保存</button>
    ${window.LedgerLocal?`<section class="sec"><div class="sec-h"><h2>数据</h2></div><div class="group">
      <button class="li go" id="exportData"><span class="grow">导出备份</span>${CHEV}</button>
      <label class="li go" for="importFile"><span class="grow" id="importLabel">导入备份</span>${CHEV}<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    </div></section>`:""}`;
  app.innerHTML=h;
  $("#pPay").oninput=e=>{draft.payday=e.target.value};
  $("#pIncome").oninput=e=>{draft.income=e.target.value;updSum()};
  $("#pSaving").oninput=e=>{draft.saving=e.target.value;updSum()};
  app.querySelectorAll("[data-k]").forEach(inp=>inp.oninput=e=>{draft.cats[+inp.dataset.i][inp.dataset.k]=e.target.value;updSum()});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{draft.cats.splice(+b.dataset.del,1);render()});
  app.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{const c=draft.cats[+b.dataset.ti];c.type=b.dataset.type;c.dates=c.dates||[];render()});
  app.querySelectorAll("[data-rmdate]").forEach(b=>b.onclick=()=>{const c=draft.cats[+b.dataset.ci];c.dates=c.dates.filter(v=>v!==b.dataset.rmdate);render()});
  app.querySelectorAll("[data-adddate]").forEach(inp=>inp.onchange=()=>{
    const v=inp.value;if(!v)return;
    if(!inPeriod(v,month)){toast("请选本期内的日期",true);inp.value="";return}
    const c=draft.cats[+inp.dataset.ci];c.dates=c.dates||[];if(!c.dates.includes(v))c.dates.push(v);render()});
  $("#addCat").onclick=()=>{draft.cats.push({id:uid(),name:"",budget:"",type:"daily",dates:[]});render();const l=draft.cats[draft.cats.length-1];const el=document.getElementById("cn-"+l.id);if(el)el.focus()};
  $("#cancelPlan").onclick=()=>{draft=null;view=lastView;render()};
  $("#savePlan").onclick=savePlan;$("#savePlanTop").onclick=savePlan;
  if(window.LedgerLocal){
    $("#exportData").onclick=()=>window.LedgerLocal.exportFile().catch(()=>toast("导出失败",true));
    $("#importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{const n=window.LedgerLocal.importText(await f.text());toast(`已导入 ${n} 条`);setTimeout(()=>location.reload(),800)}
      catch(err){toast("文件格式不对",true)}};
  }
  updSum();
}
function updSum(){
  const inc=parseNum(draft.income),sav=parseNum(draft.saving),b=r2(draft.cats.reduce((a,c)=>a+parseNum(c.budget),0));
  const free=r2(inc-sav-b),box=$("#sumbox");if(!box)return;
  box.innerHTML=`<div class="sum-row"><span>工资</span><span class="n">${money(inc)}</span></div>
    <div class="sum-row dim"><span>计划存下</span><span class="n">${money(-sav)}</span></div>
    <div class="sum-row dim"><span>各类开销</span><span class="n">${money(-b)}</span></div>
    <div class="rule"></div>
    <div class="sum-row sum-total"><span>${free>=0?"未分配":"超出"}</span><span class="n ${free<0?"neg":""}">${money(Math.abs(free))}</span></div>`;
}
async function savePlan(){
  const pd=Math.round(parseNum(draft.payday))||1;
  if(pd<1||pd>31){toast("发薪日请填 1 到 31",true);return}
  const cats=draft.cats.filter(c=>String(c.name).trim()).map(c=>{const t=c.type||"daily";const o={id:c.id,name:String(c.name).trim().slice(0,20),budget:parseNum(c.budget),type:t};
    if(t==="sched")o.dates=[...new Set(c.dates||[])].sort();return o});
  if(!cats.length){toast("至少保留一个分类",true);return}
  const body={income:parseNum(draft.income),saving:parseNum(draft.saving),cats,updatedAt:Date.now()};
  const btns=["savePlan","savePlanTop"].map(id=>document.getElementById(id)).filter(Boolean);
  btns.forEach(b=>b.disabled=true);
  try{
    await db.doc("months/"+month).set(body);
    if(pd!==payday)await db.doc("settings/main").set({payday:pd});
    draft=null;view=lastView;render();toast(pd!==payday?"已保存，账期改为每月 "+pd+" 号起":"规划已保存");
  }catch(e){btns.forEach(b=>b.disabled=false);toast("保存失败："+(e.message||"请重试"),true)}
}

/* ---------- 见面日期快速修改 ---------- */
function openMeet(){
  const sc=((plan&&plan.cats)||[]).find(c=>ctype(c)==="sched");if(!sc)return;
  let ds=schedDates(sc,month).filter(x=>inPeriod(x,month));
  const draw=()=>{
    $("#sheetHost").innerHTML=`<div class="overlay" id="ov"></div><div class="sheet" role="dialog" aria-label="${esc(sc.name)}日期"><div class="in">
      <div class="sheet-bar"><button class="txt-btn" id="closeS">取消</button><h3>${esc(sc.name)}日期</h3><button class="txt-btn strong" id="saveS">保存</button></div>
      <div class="group blk">${datePickHtml("",ds)}</div>
    </div></div>`;
    $("#ov").onclick=closeSheet;$("#closeS").onclick=closeSheet;
    document.querySelectorAll("#sheetHost [data-rmdate]").forEach(b=>b.onclick=()=>{ds=ds.filter(v=>v!==b.dataset.rmdate);draw()});
    const inp=document.querySelector("#sheetHost [data-adddate]");
    inp.onchange=()=>{const v=inp.value;if(!v)return;if(!inPeriod(v,month)){toast("请选本期内的日期",true);inp.value="";return}if(!ds.includes(v))ds.push(v);ds.sort();draw()};
    $("#saveS").onclick=async()=>{
      const p=JSON.parse(JSON.stringify(plan));
      p.cats=p.cats.map(c=>{if(c.id!==sc.id)return c;const o=Object.assign({},c,{type:"sched",dates:ds.slice().sort()});delete o.days;return o});
      p.autoCopied=false;p.updatedAt=Date.now();
      $("#saveS").disabled=true;
      try{await db.doc("months/"+month).set(p);closeSheet();toast(sc.name+"日期已更新")}catch(e){$("#saveS").disabled=false;toast("保存失败，请重试",true)}
    };
  };
  draw();
}

/* ---------- 记一笔（支出 / 收入） ---------- */
let sheetMode="exp",sheetCat=null,sheetOcc=null,sheetSub="吃饭",sheetKind="奖金";
function openSheet(rec,mode){
  if(!db||!ready()){toast("账本还没打开，请稍等",true);return}
  const cats=(plan&&plan.cats)||[];
  if(!cats.length&&!rec){toast("先做好本期规划，再开始记账");openPlan(null);return}
  sheetMode=mode||"exp";
  const isNew=!rec,c=compute();
  const defDate=rec?rec.date:(c.isCur?c.today:startOf(month));
  const firstDaily=cats.find(ct=>ctype(ct)==="daily");
  sheetCat=firstDaily&&firstDaily.id;sheetSub="吃饭";sheetKind="奖金";sheetOcc=null;
  if(rec&&sheetMode==="inc")sheetKind=rec.kind||"其他";
  else if(rec){if(cats.some(x=>x.id===rec.cat&&ctype(x)==="sched")){sheetOcc=rec.cat;sheetSub=rec.sub||"其他"}else sheetCat=rec.cat}
  else sheetOcc=occFor(defDate);
  const title=rec?"编辑":"记一笔";
  $("#sheetHost").innerHTML=`<div class="overlay" id="ov"></div><div class="sheet" role="dialog" aria-label="${title}"><div class="in">
    <div class="sheet-bar"><button class="txt-btn" id="closeS">取消</button><h3>${title}</h3><button class="txt-btn strong" id="saveS">${rec?"保存":"记下"}</button></div>
    ${isNew?`<div class="seg" id="modeSeg"><button data-m="exp" aria-pressed="true">支出</button><button data-m="inc" aria-pressed="false">收入</button></div>`:""}
    <label class="amount" for="amt"><span id="amtSign">¥</span><input id="amt" inputmode="decimal" placeholder="0" autocomplete="off" value="${rec?esc(rec.amount):""}"></label>
    <div class="picks" id="picks"></div>
    <div class="group">
      <div class="li"><label for="sDate">日期</label><input class="fin" type="date" id="sDate" value="${defDate}"></div>
      <div class="li"><label for="sNote">备注</label><input class="fin grow" id="sNote" placeholder="" maxlength="40" value="${rec?esc(rec.note||""):""}"></div>
    </div>
    ${rec?`<button class="danger" id="delS">删除</button>`:""}
  </div></div>`;
  $("#ov").onclick=closeSheet;$("#closeS").onclick=closeSheet;
  document.querySelectorAll("#modeSeg [data-m]").forEach(b=>b.onclick=()=>{sheetMode=b.dataset.m;document.querySelectorAll("#modeSeg [data-m]").forEach(q=>q.setAttribute("aria-pressed",q===b));drawPicks(rec)});
  $("#sDate").onchange=()=>{sheetOcc=occFor($("#sDate").value);drawPicks(rec)};
  $("#saveS").onclick=()=>saveRec(rec);
  const d=$("#delS");if(d)d.onclick=()=>{if(!d.classList.contains("armed")){d.classList.add("armed");d.textContent="确认删除";return}delRec(rec)};
  const amt=$("#amt"),fit=()=>{amt.style.width=Math.max(1,amt.value.length)*.62+.3+"em"};
  amt.addEventListener("input",fit);fit();
  amt.addEventListener("keydown",e=>{if(e.key==="Enter")saveRec(rec)});
  drawPicks(rec);
  if(!rec)amt.focus();
}
function occFor(date){
  if(!date||!inPeriod(date,month))return null;
  const ct=((plan&&plan.cats)||[]).find(c=>ctype(c)==="sched"&&schedDates(c,month).includes(date));return ct?ct.id:null;
}
function drawPicks(rec){
  const cats=(plan&&plan.cats)||[],c=compute(),box=$("#picks");
  const leftOf=ct=>r2((ct.budget||0)-(c.byCat[ct.id]||0));
  $("#amtSign").textContent=sheetMode==="inc"?"+¥":"¥";
  if(sheetMode==="inc"){
    box.innerHTML=INC_KINDS.map(s=>`<button class="pick" data-k="${s}" aria-pressed="${s===sheetKind}">${s}</button>`).join("");
    box.querySelectorAll("[data-k]").forEach(p=>p.onclick=()=>{sheetKind=p.dataset.k;box.querySelectorAll(".pick").forEach(q=>q.setAttribute("aria-pressed",q===p))});
  }else if(sheetOcc){
    const oc=cats.find(x=>x.id===sheetOcc);
    box.innerHTML=SUBS.map(s=>`<button class="pick" data-s="${s}" aria-pressed="${s===sheetSub}">${s}</button>`).join("");
    box.querySelectorAll("[data-s]").forEach(p=>p.onclick=()=>{sheetSub=p.dataset.s;box.querySelectorAll(".pick").forEach(q=>q.setAttribute("aria-pressed",q===p))});
  }else{
    const list=cats.map((ct,i)=>[ct,i]).filter(([ct])=>ctype(ct)==="daily");
    let h=list.map(([ct,i])=>{const left=leftOf(ct);
      return `<button class="pick" data-c="${ct.id}" aria-pressed="${ct.id===sheetCat}"><i class="dot" style="background:${catColor(i)}"></i>${esc(ct.name)}</button>`}).join("");
    if(rec&&sheetMode==="exp"&&rec.cat&&!list.some(([ct])=>ct.id===rec.cat)&&!cats.some(x=>x.id===rec.cat&&ctype(x)==="sched"))
      h+=`<button class="pick" data-c="${esc(rec.cat)}" aria-pressed="${sheetCat===rec.cat}">${esc(rec.catName||"未分类")}</button>`;
    box.innerHTML=h;
    box.querySelectorAll("[data-c]").forEach(p=>p.onclick=()=>{sheetCat=p.dataset.c;box.querySelectorAll(".pick").forEach(q=>q.setAttribute("aria-pressed",q===p))});
  }
}
function closeSheet(){$("#sheetHost").innerHTML=""}
async function saveRec(rec){
  const amount=parseNum($("#amt").value);
  if(amount<=0){toast("请输入金额",true);$("#amt").focus();return}
  const date=$("#sDate").value||todayStr(),note=$("#sNote").value.trim().slice(0,40),ts=rec&&rec.ts||Date.now(),key=keyOf(date);
  let coll,body,msg=rec?"已保存":"记好了",bad=false;
  if(sheetMode==="inc"){
    coll="incomes";body={month:key,date,amount,kind:sheetKind,note,ts};msg=rec?"已保存":`收入 +${money(amount)} 已记下`;
  }else{
    const cats=(plan&&plan.cats)||[],catId=sheetOcc||sheetCat||"",ct=cats.find(c=>c.id===catId);
    coll="expenses";body={month:key,date,amount,cat:catId,catName:ct?ct.name:(rec&&rec.catName)||"未分类",note,ts};
    if(sheetOcc)body.sub=sheetSub||"其他";
    if(key===month&&ct){
      const prev=exps.filter(e=>e.cat===ct.id&&(!rec||e.id!==rec.id)).reduce(sum,0),after=r2(prev+amount),b=Number(ct.budget||0);
      if(after>b){msg=`${ct.name}超出预算 ${money(after-b)}`;bad=true}
      else if(b>0&&after/b>=.85)msg=`记好了，${ct.name}只剩 ${money(b-after)}`;
    }
  }
  if(key!==month)msg=`已记到 ${periodLabel(key)}`;
  const btn=$("#saveS");btn.disabled=true;
  try{
    if(rec)await db.doc(coll+"/"+rec.id).set(body);else await db.collection(coll).add(body);
    closeSheet();toast(msg,bad);
  }catch(e){btn.disabled=false;toast(e&&e.code==="quota_exceeded"?"存储已满，请删除一些旧记录":"保存失败，请重试",true)}
}
async function delRec(rec){
  try{await db.doc((sheetMode==="inc"?"incomes/":"expenses/")+rec.id).delete();closeSheet();toast("已删除")}catch(e){toast("删除失败，请重试",true)}
}

/* ---------- misc ---------- */
let tt;function toast(t,bad){clearTimeout(tt);$("#toastHost").innerHTML=`<div class="toast ${bad?"bad":""}" role="status">${esc(t)}</div>`;tt=setTimeout(()=>{$("#toastHost").innerHTML=""},bad?3800:2400)}
document.querySelectorAll("[data-tab]").forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
$("#addBtn").onclick=()=>openSheet(null,"exp");

render();
(async()=>{
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  dbState=db?"ready":"none";
  if(db)boot();else render();
})();
})();
</script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
